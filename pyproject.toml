[tool.ruff.lint]
select = ["ALL"]
ignore =[
    "ANN401",
    "CPY001",
    "COM812",
    "COM819",
    "S310",
    "EM101",
    "EM102",
    "D203",
    "D213",
    "EXE002",
    "TRY003",
    "TRY400",
]

[tool.mypy]
files = ["."]
exclude = ["\\.venv/"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true

[tool.ruff]
line-length = 110

[tool.black]
line-length = 110
