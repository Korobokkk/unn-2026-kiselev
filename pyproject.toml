[tool.ruff.lint]
select = ["ALL"]
ignore =[
    "ANN401",
    "CPY001",
    "COM812",
    "COM819",
    "S310",
    "EM101",
    "EM102",
    "D203",
    "D213",
    "EXE002",
    "TRY003",
    "TRY400",
    "E402",
    "PIE790", 
    "PT009",
    "TC001",
    "FBT001",
    "D401",
    "I001",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.mypy]
files = ["new_bot"]

exclude = ["tests/","\\.venv/"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true

[tool.ruff]
line-length = 110
